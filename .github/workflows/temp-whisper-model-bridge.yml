name: Temp Whisper model bridge

on:
  push:
    branches:
      - tmp-chatgpt-whisper-model-20261014

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base q5_1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/f281eb45af861ab5e5297d23694b7d46e090c02c/ggml-base-q5_1.bin
          echo "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  ggml-base-q5_1.bin" | sha256sum -c -
          ls -lh ggml-base-q5_1.bin

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: ggml-base-q5_1.bin
          retention-days: 1
          if-no-files-found: error
